# Import the Godot 4.7.2 project and parse the placeholder script.
# This does not export a build. Export templates are not installed here.

name: Godot check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  import-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libraries the Godot editor needs headless
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip \
            ca-certificates \
            libfontconfig1 \
            libglib2.0-0 \
            libgl1 \
            libx11-6 \
            libxcursor1 \
            libxext6 \
            libxi6 \
            libxinerama1 \
            libxrandr2 \
            libxrender1

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          bin="$(find /tmp/godot -type f -name 'Godot_v4.7.2-stable_linux*' | head -n 1)"
          test -n "$bin"
          chmod +x "$bin"
          sudo mv "$bin" /usr/local/bin/godot
          godot --version

      - name: Import the project
        run: godot --headless --path . --import

      - name: Check the game scripts
        run: |
          godot --headless --path . --check-only --script res://scripts/game_state.gd
          godot --headless --path . --check-only --script res://scenes/main.gd

      - name: Run the simulation checks
        run: godot --headless --path . --script res://scripts/sim_test.gd
